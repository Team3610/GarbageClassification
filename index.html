<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GarbageClassification</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>GarbageClassification</h1>
    <p>이미지 기반 분리수거 분류 도움 서비스</p>
  </header>

  <main class="page-layout">
    <section class="upload-section" aria-labelledby="upload-title">
      <h2 id="upload-title">이미지 업로드</h2>
      <label class="upload-box" for="waste-image">
        <span>분류할 쓰레기 이미지를 선택하세요.</span>
        <input id="waste-image" type="file" accept="image/*">
      </label>
    </section>

    <section class="result-section" aria-labelledby="result-title">
      <h2 id="result-title">분류 결과</h2>
      <div class="result-box">
        <p>이미지를 업로드하면 이 영역에 분류 결과가 표시됩니다.</p>
      </div>
    </section>

    <section class="guide-section" aria-labelledby="guide-title">
      <h2 id="guide-title">안내</h2>
      <p>
        현재 화면은 기본 레이아웃 확인용입니다. 이미지 분석, API 연동,
        결과 계산 기능은 아직 구현되어 있지 않습니다.
      </p>
    </section>
  </main>
</body>
</html>
